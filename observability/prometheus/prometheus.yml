global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: zoohelp-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: nats
    metrics_path: /varz
    static_configs:
      - targets:
          - nats:8222
