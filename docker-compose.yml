services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: zoohelp
      POSTGRES_USER: zoohelp
      POSTGRES_PASSWORD: zoohelp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
volumes:
  postgres_data:
